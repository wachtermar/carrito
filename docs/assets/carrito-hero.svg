<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc">
  <title id="title">Carrito — guarded grocery actions</title>
  <desc id="desc">The model proposes a plan, deterministic code enforces the limits, and a person owns checkout.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#314238"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#080d0a"/></filter>
  </defs>
  <rect width="800" height="420" fill="#111a15"/>
  <rect width="800" height="420" fill="url(#grid)" opacity=".72"/>
  <rect width="800" height="10" fill="#ffe182"/>
  <rect y="410" width="800" height="10" fill="#ffe182"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="40" y="42" width="18" height="18" fill="#ffe182" stroke="#080d0a" stroke-width="3"/>
    <text x="72" y="59" fill="#eef7f0" font-size="22" font-weight="800" letter-spacing="1.5">PUBLIC GO SYSTEM</text>
    <text x="40" y="124" fill="#f7fbf6" font-size="52" font-weight="900" letter-spacing="-2">GUARDED GROCERY</text>
    <text x="40" y="180" fill="#f7fbf6" font-size="52" font-weight="900" letter-spacing="-2">ACTIONS</text>
    <text x="42" y="224" fill="#b8c9be" font-size="26" font-weight="700">Inspect every consequential step.</text>

    <g transform="translate(42 264)" filter="url(#shadow)">
      <rect width="716" height="104" fill="#eef7f0" stroke="#080d0a" stroke-width="4"/>
      <rect x="16" y="16" width="210" height="72" fill="#fff" stroke="#111a15" stroke-width="3"/>
      <text x="121" y="47" text-anchor="middle" fill="#111a15" font-size="24" font-weight="900">MODEL</text>
      <text x="121" y="73" text-anchor="middle" fill="#111a15" font-size="24" font-weight="900">PROPOSES</text>
      <rect x="253" y="16" width="210" height="72" fill="#ffe182" stroke="#111a15" stroke-width="3"/>
      <text x="358" y="47" text-anchor="middle" fill="#111a15" font-size="24" font-weight="900">CLI</text>
      <text x="358" y="73" text-anchor="middle" fill="#111a15" font-size="24" font-weight="900">ENFORCES</text>
      <rect x="490" y="16" width="210" height="72" fill="#111a15" stroke="#111a15" stroke-width="3"/>
      <text x="595" y="47" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">HUMAN</text>
      <text x="595" y="73" text-anchor="middle" fill="#fff" font-size="24" font-weight="900">CHECKOUT</text>
    </g>
  </g>
</svg>
