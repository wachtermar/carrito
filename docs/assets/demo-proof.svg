<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Successful Carrito in-memory browser fixture</title>
  <desc id="desc">The fixture validates, writes, reads an independent snapshot, verifies two cart lines at 2.90 euros under a 10 euro cap, and stops before checkout.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#314238"/></pattern></defs>
  <rect width="800" height="500" fill="#111a15"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  <rect width="800" height="10" fill="#ffe182"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="62" fill="#b8c9be" font-size="24" font-weight="900" letter-spacing="1.4">STATEFUL BROWSER FIXTURE</text>
    <text x="40" y="124" fill="#fff" font-size="48" font-weight="900">GUARD PASSED.</text>
    <text x="40" y="174" fill="#fff" font-size="48" font-weight="900">STATE VERIFIED.</text>

    <rect x="40" y="210" width="720" height="106" fill="#ffe182" stroke="#080d0a" stroke-width="4"/>
    <text x="70" y="254" fill="#65776b" font-size="24" font-weight="900">WHOLE-CART CHECK</text>
    <text x="70" y="296" fill="#111a15" font-size="38" font-weight="900">€2.90 ≤ €10.00</text>
    <text x="730" y="274" text-anchor="end" fill="#111a15" font-size="32" font-weight="900">VERIFIED: TRUE</text>

    <rect x="40" y="344" width="720" height="70" fill="#eef7f0" stroke="#080d0a" stroke-width="4"/>
    <text x="400" y="389" text-anchor="middle" fill="#111a15" font-size="28" font-weight="900">VALIDATE → WRITE → INDEPENDENT READ-BACK</text>

    <text x="40" y="466" fill="#ffe182" font-size="26" font-weight="900">2 LINES · IDEMPOTENT RERUN · NO CHECKOUT</text>
  </g>
</svg>
