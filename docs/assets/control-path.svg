<svg xmlns="http://www.w3.org/2000/svg" width="800" height="940" viewBox="0 0 800 940" role="img" aria-labelledby="title desc">
  <title id="title">Carrito flow from a dinner idea to a checked cart</title>
  <desc id="desc">A vertical product flow covers the meal request, grocery resolution, whole-cart limit, write and read-back, cooking page, and human checkout.</desc>
  <rect width="800" height="940" fill="#f7f2e8"/>
  <circle cx="748" cy="54" r="88" fill="#f8e4d7"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="42" cy="45" r="7" fill="#df6b3a"/>
    <text x="58" y="52" fill="#1d6046" font-family="Georgia, Times New Roman, serif" font-size="30" font-weight="700">carrito</text>
    <text x="42" y="110" fill="#1f2924" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700">From a dinner idea</text>
    <text x="42" y="156" fill="#1f2924" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700">to a checked cart.</text>

    <g transform="translate(42 204)">
      <rect width="716" height="104" rx="22" fill="#fffdf8" stroke="#ded9cf" stroke-width="2"/>
      <circle cx="52" cy="52" r="26" fill="#f8e4d7"/>
      <text x="52" y="60" text-anchor="middle" fill="#7e3014" font-size="22" font-weight="800">1</text>
      <text x="98" y="45" fill="#df6b3a" font-size="16" font-weight="800">HOUSEHOLD REQUEST</text>
      <text x="98" y="77" fill="#1f2924" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">Plan the meals</text>
      <path d="M358 104v26" stroke="#b9c2bc" stroke-width="4" stroke-linecap="round"/>

      <rect y="140" width="716" height="104" rx="22" fill="#fffdf8" stroke="#ded9cf" stroke-width="2"/>
      <circle cx="52" cy="192" r="26" fill="#f8e4d7"/>
      <text x="52" y="200" text-anchor="middle" fill="#7e3014" font-size="22" font-weight="800">2</text>
      <text x="98" y="185" fill="#df6b3a" font-size="16" font-weight="800">PRODUCT CANDIDATES</text>
      <text x="98" y="217" fill="#1f2924" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">Resolve the groceries</text>
      <path d="M358 244v26" stroke="#b9c2bc" stroke-width="4" stroke-linecap="round"/>

      <rect y="280" width="716" height="104" rx="22" fill="#dfece4" stroke="#b9d2c2" stroke-width="2"/>
      <circle cx="52" cy="332" r="26" fill="#1d6046"/>
      <text x="52" y="340" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">3</text>
      <text x="98" y="325" fill="#1d6046" font-size="16" font-weight="800">WHOLE-CART GUARD</text>
      <text x="98" y="357" fill="#1f2924" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">Check the spending limit</text>
      <path d="M358 384v26" stroke="#b9c2bc" stroke-width="4" stroke-linecap="round"/>

      <rect y="420" width="716" height="104" rx="22" fill="#1d6046"/>
      <circle cx="52" cy="472" r="26" fill="#fffdf8"/>
      <text x="52" y="480" text-anchor="middle" fill="#1d6046" font-size="22" font-weight="800">4</text>
      <text x="98" y="465" fill="#bfe0cd" font-size="16" font-weight="800">GUARDED ACTION</text>
      <text x="98" y="497" fill="#fff" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">Write, then read the cart back</text>
      <path d="M358 524v26" stroke="#b9c2bc" stroke-width="4" stroke-linecap="round"/>

      <rect y="560" width="716" height="104" rx="22" fill="#fffdf8" stroke="#ded9cf" stroke-width="2"/>
      <circle cx="52" cy="612" r="26" fill="#f8e4d7"/>
      <text x="52" y="620" text-anchor="middle" fill="#7e3014" font-size="22" font-weight="800">5</text>
      <text x="98" y="605" fill="#df6b3a" font-size="16" font-weight="800">SHAREABLE OUTPUT</text>
      <text x="98" y="637" fill="#1f2924" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="700">Open the cooking page</text>
    </g>

    <rect x="42" y="898" width="716" height="1" fill="#ded9cf"/>
    <text x="42" y="870" fill="#7e3014" font-size="22" font-weight="800">AUTOMATION STOPS · YOU REVIEW AND CHECK OUT</text>
  </g>
</svg>
