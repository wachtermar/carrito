<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920" role="img" aria-labelledby="title desc">
  <title id="title">Carrito end-to-end control path</title>
  <desc id="desc">A vertical mobile-readable flow from model proposal through CLI validation, spend guard, write and read-back, bounded recovery, and human checkout.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#d9e6dc"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#111a15"/></marker>
  </defs>
  <rect width="800" height="920" fill="#faf8f2"/>
  <rect width="800" height="920" fill="url(#grid)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="42" y="52" fill="#65776b" font-size="24" font-weight="900" letter-spacing="1.5">END-TO-END CONTROL PATH</text>
    <text x="42" y="106" fill="#111a15" font-size="42" font-weight="900">Who can reason. Who can write.</text>
    <text x="42" y="150" fill="#111a15" font-size="42" font-weight="900">Where automation stops.</text>

    <g transform="translate(42 190)">
      <rect width="716" height="104" fill="#eef7f0" stroke="#111a15" stroke-width="4"/>
      <text x="24" y="42" fill="#65776b" font-size="24" font-weight="900">01 · HERMES AGENT</text>
      <text x="24" y="80" fill="#111a15" font-size="34" font-weight="900">PROPOSE THE PLAN</text>
      <line x1="358" y1="104" x2="358" y2="140" stroke="#111a15" stroke-width="4" marker-end="url(#arrow)"/>

      <rect y="150" width="716" height="104" fill="#fff" stroke="#111a15" stroke-width="4"/>
      <text x="24" y="192" fill="#65776b" font-size="24" font-weight="900">02 · CARRITO CLI</text>
      <text x="24" y="230" fill="#111a15" font-size="34" font-weight="900">VALIDATE + RESOLVE</text>
      <line x1="358" y1="254" x2="358" y2="290" stroke="#111a15" stroke-width="4" marker-end="url(#arrow)"/>

      <rect y="300" width="716" height="104" fill="#ffe182" stroke="#111a15" stroke-width="4"/>
      <text x="24" y="342" fill="#65776b" font-size="24" font-weight="900">03 · CARRITO CLI</text>
      <text x="24" y="380" fill="#111a15" font-size="34" font-weight="900">READ CURRENT + GUARD CAP</text>
      <line x1="358" y1="404" x2="358" y2="440" stroke="#111a15" stroke-width="4" marker-end="url(#arrow)"/>

      <rect y="450" width="716" height="104" fill="#111a15" stroke="#111a15" stroke-width="4"/>
      <text x="24" y="492" fill="#9db0a3" font-size="24" font-weight="900">04 · CARRITO CLI</text>
      <text x="24" y="530" fill="#fff" font-size="34" font-weight="900">WRITE + READ BACK</text>
    </g>

    <g transform="translate(42 776)">
      <rect width="220" height="96" fill="#eef7f0" stroke="#111a15" stroke-width="4"/>
      <text x="110" y="39" text-anchor="middle" fill="#65776b" font-size="22" font-weight="900">PASS</text>
      <text x="110" y="71" text-anchor="middle" fill="#111a15" font-size="28" font-weight="900">VERIFIED</text>
      <rect x="248" width="220" height="96" fill="#ffe6df" stroke="#111a15" stroke-width="4"/>
      <text x="358" y="39" text-anchor="middle" fill="#7a554d" font-size="22" font-weight="900">FAIL</text>
      <text x="358" y="71" text-anchor="middle" fill="#111a15" font-size="22" font-weight="900">RECOVER OR STOP</text>
      <rect x="496" width="220" height="96" fill="#fff" stroke="#111a15" stroke-width="4"/>
      <text x="606" y="39" text-anchor="middle" fill="#65776b" font-size="22" font-weight="900">BOUNDARY</text>
      <text x="606" y="71" text-anchor="middle" fill="#111a15" font-size="22" font-weight="900">HUMAN CHECKOUT</text>
    </g>
  </g>
</svg>
