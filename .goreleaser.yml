version: 2

project_name: carrito

builds:
  - id: carrito
    main: ./cmd/carrito
    binary: carrito
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/wachtermar/carrito/internal/cli.Version={{ .Version }}
      - -X github.com/wachtermar/carrito/internal/cli.Commit={{ .Commit }}
      - -X github.com/wachtermar/carrito/internal/cli.Date={{ .Date }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
